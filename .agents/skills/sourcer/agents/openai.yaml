interface:
  display_name: "Sourcer-Bot"
  short_description: "Busca y rankea candidatos según el ICP del HRBP."
  default_prompt: "Busca candidatos para la vacante activa y devuelve top-10 con scoring y rationale."

execution:
  default_model: "gemini-1.5-flash"
  fallback_model: "gpt-4o-mini"
  max_input_tokens: 8000
  max_output_tokens: 2000
  temperature: 0.2
  cost_cap_usd: 0.05

triggers:
  - type: timer
    intervalSec: 21600   # 6 horas
  - type: on_demand

permissions:
  read:
    - vacantes
    - candidatos
    - empresas.blacklist_dominios
  write:
    - candidatos_sourced
    - applications

evals:
  golden_set: ./evals/golden_set.jsonl
  regression_set: ./evals/regression_set.jsonl
  thresholds:
    recall_at_10: 0.7
    pearson_r: 0.75
    schema_valid: 1.0
