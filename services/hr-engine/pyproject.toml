[project]
name = "vortex-hr-engine"
version = "0.1.0"
description = "Vortex Ops · HR execution engine (FastAPI + Celery)"
requires-python = ">=3.12"
authors = [{ name = "Vector HR Tech", email = "ilyra.rivas@wearesiete.com" }]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy>=2.0.36",
    "asyncpg>=0.30.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "celery>=5.4.0",
    "redis>=5.2.0",
    "httpx>=0.27.0",
    "structlog>=24.4.0",
    # Run-tokens (ADR-005). Sustituye a python-jose, casi sin mantenimiento y con
    # avisos abiertos (algorithm confusion; ecdsa sin corrección). `crypto` habilita RS256.
    "pyjwt[crypto]>=2.15.1",
    "slowapi>=0.1.9",
    "openai>=1.54.0",
    "google-genai>=1.0.0",
    "sentry-sdk[fastapi]>=2.18.0",
    "opentelemetry-api>=1.28.0",
    "opentelemetry-sdk>=1.28.0",
    "opentelemetry-exporter-otlp-proto-http>=1.28.0",
    "opentelemetry-instrumentation-fastapi>=0.49b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.49b0",
    "opentelemetry-instrumentation-celery>=0.49b0",
    "tenacity>=9.0.0",
    # Frontmatter de los SKILL.md (app/skills.py). Ya venía como transitiva;
    # se declara porque el código la importa directamente.
    "pyyaml>=6.0",
    # Texto de los CVs en PDF para la coincidencia de skills del plan gratis (ADR-019).
    "pypdf>=6.21.1",
    # El XML de un DOCX lo sube un candidato: la documentación de Python recomienda
    # defusedxml para XML no confiable en el servidor.
    "defusedxml>=0.7.1",
]

# PEP 735 dependency groups. `uv sync` los instala por defecto (a diferencia de
# los extras PEP 621, que requieren `--extra dev`); por eso el CI puede correr
# `uv sync --frozen && uv run ruff/mypy/pytest` sin flags extra.
[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "mypy>=1.13.0",
    "ruff>=0.7.0",
    "celery-types>=0.22.0",
    # Tipos de PyYAML para mypy (app/skills.py importa yaml).
    "types-pyyaml>=6.0",
    # Tipos de defusedxml para mypy (app/infrastructure/coincidencias.py).
    "types-defusedxml>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = [".venv", ".mypy_cache", ".ruff_cache"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "B", "A", "C4", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# Patrón estándar de FastAPI: las dependencias van como default del argumento.
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Security",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body",
    "fastapi.Header",
]

[tool.ruff.lint.per-file-ignores]
# Los tests acceden a `_run` (privado por diseño: el wrapper Celery es público).
"tests/**" = ["SLF001"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
# SDKs sin stubs completos.
module = [
    "google.genai.*",
    "slowapi.*",
    "opentelemetry.instrumentation.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
addopts = "-v --strict-markers"
# Una clave HMAC de menos de 32 bytes es un error en los tests, no un aviso que se
# pierde en la salida (PyJWT, InsecureKeyLengthWarning).
filterwarnings = ["error::jwt.warnings.InsecureKeyLengthWarning"]
markers = [
    "integration: requires Postgres + Redis",
    "rls: multi-tenant RLS test",
    "slow: takes > 5s",
]

[tool.coverage.run]
source = ["app"]
omit = ["app/workers/celery_app.py"]
