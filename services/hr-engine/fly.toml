# hr-engine en Fly.io (ADR-012): la API, el worker de Celery y un solo beat, con la
# misma imagen. São Paulo (`gru`), cerca de Supabase (sa-east-1) y de los usuarios.
#
# La imagen no se construye con `fly deploy`: necesita el contexto `skills`
# (.agents/skills) y flyctl no pasa contextos con nombre. La construye y la sube el
# workflow `deploy-hr-engine.yml`, que después corre `fly deploy --image`.
#
# Primer despliegue y secretos: docs/runbooks/deploy.md, "hr-engine en Fly.io".

app = "vortex-hr-engine"
primary_region = "gru"
kill_signal = "SIGTERM"
kill_timeout = 60

[env]
  ENV = "production"
  LOG_LEVEL = "info"

[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
  worker = "celery -A app.workers.celery_app worker --loglevel=info --concurrency=2"
  # Exactamente una máquina (`fly scale count beat=1`): dos beats programan cada
  # tarea dos veces (Celery: "you have to ensure only a single scheduler is running").
  beat = "celery -A app.workers.celery_app beat --loglevel=info --schedule=/tmp/celerybeat-schedule"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 0
  processes = ["api"]

  [[http_service.checks]]
    grace_period = "20s"
    interval = "30s"
    method = "GET"
    path = "/ready"
    timeout = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  processes = ["api", "worker", "beat"]
