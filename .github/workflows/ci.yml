name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "20"
  PNPM_VERSION: "9"
  PYTHON_VERSION: "3.12"
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

jobs:
  # ──────────────────── JS / TS ────────────────────
  lint-ts:
    name: Lint TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  typecheck:
    name: Typecheck TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck

  unit-ts:
    name: Unit tests (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test --coverage
      - uses: codecov/codecov-action@v4
        with:
          flags: typescript
          token: ${{ secrets.CODECOV_TOKEN }}

  build-ts:
    name: Build TS
    runs-on: ubuntu-latest
    needs: [lint-ts, typecheck]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Bundle size budget
        run: pnpm exec size-limit

  # ──────────────────── Python ────────────────────
  # Matriz limitada a los servicios que YA existen. Cuando arranquen
  # sales-engine (cycle 3) y control-plane (Paperclip · Node, no aplica aquí),
  # añadirlos a la lista.
  lint-py:
    name: Lint Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [hr-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - working-directory: services/${{ matrix.service }}
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .

  typecheck-py:
    name: Typecheck Python (mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [hr-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - working-directory: services/${{ matrix.service }}
        run: |
          uv sync --frozen
          uv run mypy app

  unit-py:
    name: Unit tests (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [hr-engine]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - working-directory: services/${{ matrix.service }}
        run: |
          uv sync --frozen
          uv run pytest tests/unit -q --cov=app --cov-report=xml
      - uses: codecov/codecov-action@v4
        with:
          flags: python-${{ matrix.service }}
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-py:
    name: Integration tests (Python + Postgres + Redis)
    runs-on: ubuntu-latest
    # Skip hasta que existan tests de integración reales (cycle 1 entregable).
    if: false
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex
          POSTGRES_DB: vortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        service: [hr-engine]
    env:
      DATABASE_URL: postgresql+asyncpg://vortex:vortex@localhost:5432/vortex_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - working-directory: services/${{ matrix.service }}
        run: |
          uv sync --frozen
          uv run pytest tests/integration -q

  rls-tests:
    name: Multi-tenant RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Imagen con pgvector + extensiones estándar (btree_gist incluido).
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex
          POSTGRES_DB: vortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://vortex:vortex@localhost:5432/vortex_test
      JWT_SECRET: test-secret-do-not-use
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - working-directory: services/hr-engine
        # La fixture `_migrated_db` aplica los SQL files de
        # infra/supabase/migrations/ directamente — no usamos alembic.
        run: |
          uv sync --frozen
          uv run pytest tests/security/test_rls.py -q -v

  # ──────────────────── Skills (evals) ────────────────────
  evals:
    name: Skill evals
    runs-on: ubuntu-latest
    if: contains(github.event.pull_request.changed_files, '.agents/skills/')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - run: curl -LsSf https://astral.sh/uv/install.sh | sh
      - working-directory: evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          uv sync
          uv run python runner.py --suite golden --suite regression --fail-below-threshold

  # ──────────────────── Security ────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container: returntocorp/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep ci --config=auto --config=p/owasp-top-ten

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
