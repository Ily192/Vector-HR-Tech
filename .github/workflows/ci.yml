name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  TURBO_TEAM: ${{ vars.TURBO_TEAM }}
  # TURBO_TOKEN es un secreto: va solo en los pasos que corren turbo, no aquí,
  # donde lo vería cualquier paso de cualquier job (Semgrep gha-workflow-env-secret).

jobs:
  # ──────────────────── JS / TS ────────────────────
  lint-ts:
    name: Lint TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  typecheck:
    name: Typecheck TS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}

  unit-ts:
    name: Unit tests (TS)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # `pnpm test --coverage` falla antes de llegar al script: es pnpm quien
      # parsea el flag ("Unknown option: 'coverage'"), no turbo.
      - run: pnpm test:coverage
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          flags: typescript
          token: ${{ secrets.CODECOV_TOKEN }}

  build-ts:
    name: Build TS
    runs-on: ubuntu-latest
    needs: [lint-ts, typecheck]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
        env:
          TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      - name: Bundle size budget
        run: pnpm exec size-limit

  # ──────────────────── Python ────────────────────
  # Matriz limitada a los servicios que YA existen. Cuando arranquen
  # sales-engine (cycle 3) y control-plane (Paperclip · Node, no aplica aquí),
  # añadirlos a la lista.
  lint-py:
    name: Lint Python
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [hr-engine]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.12.11" }
      - working-directory: services/${{ matrix.service }}
        run: |
          uv sync --frozen
          uv run ruff check .
          uv run ruff format --check .

  typecheck-py:
    name: Typecheck Python (mypy)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [hr-engine]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.12.11" }
      - working-directory: services/${{ matrix.service }}
        run: |
          uv sync --frozen
          uv run mypy app

  unit-py:
    name: Unit tests (Python)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [hr-engine]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.12.11" }
      - working-directory: services/${{ matrix.service }}
        run: |
          uv sync --frozen
          uv run pytest tests/unit -q --cov=app --cov-report=xml --cov-fail-under=60
      - uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238 # v4.6.0
        with:
          files: services/${{ matrix.service }}/coverage.xml
          flags: python-${{ matrix.service }}
          token: ${{ secrets.CODECOV_TOKEN }}

  integration-py:
    name: Integration tests (Python + Postgres + Redis)
    runs-on: ubuntu-latest
    # Estuvo en `if: false` hasta la sesión 7, esperando tests de integración
    # reales. El primero es tests/integration/test_event_loops.py, la regresión
    # del motor sin pool para los workers, así que el job ya tiene trabajo.
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex
          POSTGRES_DB: vortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    strategy:
      matrix:
        service: [hr-engine]
    env:
      DATABASE_URL: postgresql+asyncpg://vortex:vortex@localhost:5432/vortex_test
      REDIS_URL: redis://localhost:6379/0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.12.11" }
      - working-directory: services/${{ matrix.service }}
        run: |
          uv sync --frozen
          uv run pytest tests/integration -q

  rls-tests:
    name: Multi-tenant RLS tests
    runs-on: ubuntu-latest
    services:
      postgres:
        # Imagen con pgvector + extensiones estándar (btree_gist incluido).
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: vortex
          POSTGRES_PASSWORD: vortex
          POSTGRES_DB: vortex_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql+asyncpg://vortex:vortex@localhost:5432/vortex_test
      JWT_SECRET: test-secret-do-not-use
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.12.11" }
      - working-directory: services/hr-engine
        # La fixture `_migrated_db` aplica los SQL files de
        # infra/supabase/migrations/ directamente — no usamos alembic.
        #
        # El directorio entero, no `test_rls.py` a secas: `test_search_path.py`
        # son las guardas estructurales de 0006 y apuntar al fichero las dejaba
        # fuera del gate.
        run: |
          uv sync --frozen
          uv run pytest tests/security -q -v

  # ──────────────────── Skills (evals) ────────────────────
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    outputs:
      skills: ${{ steps.filter.outputs.skills }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: dorny/paths-filter@0e4a8c6effa4802afeda77dc8d303f8176d7dfad # v3.0.4
        id: filter
        with:
          filters: |
            skills:
              - '.agents/skills/**'
              - 'evals/**'

  evals:
    name: Skill evals
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.skills == 'true'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with: { python-version: "${{ env.PYTHON_VERSION }}" }
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with: { version: "0.12.11" }
      - working-directory: evals
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          uv sync
          uv run python runner.py --suite golden --suite regression --fail-below-threshold

  # ──────────────────── Security ────────────────────
  semgrep:
    name: Semgrep SAST
    runs-on: ubuntu-latest
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # `semgrep ci` con --config=auto requiere SEMGREP_APP_TOKEN; `scan` con
      # rulesets explicitos corre sin cuenta.
      - run: semgrep scan --config=p/owasp-top-ten --config=p/secrets --error

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with: { fetch-depth: 0 }
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4.9.0
        with:
          fail-on-severity: high
