name: Deploy hr-engine (Fly.io)

# hr-engine en Fly.io (ADR-012): construye la imagen, la sube al registro de Fly y
# la despliega con services/hr-engine/fly.toml. A mano mientras el MVP no tenga
# clientes; con clientes, en cada push a main que toque services/hr-engine.
#
# `fly deploy` no sabe pasar el contexto con nombre `skills` (.agents/skills) que
# pide el Dockerfile, así que la imagen se construye aquí con buildx y Fly recibe
# `--image`. Primer despliegue y secretos: docs/runbooks/deploy.md.
on:
  workflow_dispatch:

concurrency:
  group: deploy-hr-engine
  cancel-in-progress: false

permissions:
  contents: read

env:
  FLY_APP: vortex-hr-engine

jobs:
  deploy:
    name: Build, push y fly deploy
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Comprobar el token de Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Falta el secret FLY_API_TOKEN (fly tokens create deploy -a $FLY_APP)."
            exit 1
          fi

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: registry.fly.io
          username: x
          password: ${{ secrets.FLY_API_TOKEN }}

      - name: Build & push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/hr-engine
          # Los SKILL.md de producto (ver el Dockerfile).
          build-contexts: skills=.agents/skills
          push: true
          tags: registry.fly.io/${{ env.FLY_APP }}:${{ github.sha }}
          cache-from: type=gha,scope=hr-engine
          cache-to: type=gha,mode=max,scope=hr-engine

      - uses: superfly/flyctl-actions/setup-flyctl@fc53c09e1bc3be6f54706524e3b82c4f462f77be # 1.5

      # --ha=false: una máquina por grupo. El beat tiene que ser uno solo.
      - name: fly deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          IMAGEN: registry.fly.io/${{ env.FLY_APP }}:${{ github.sha }}
        run: |
          flyctl deploy --config services/hr-engine/fly.toml --app "$FLY_APP" \
            --image "$IMAGEN" --ha=false --strategy rolling --wait-timeout 5m
