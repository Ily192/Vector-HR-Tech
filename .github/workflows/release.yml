name: Release (staging → prod canary)

on:
  push:
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/vortex

jobs:
  build-images:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service: [hr-engine, sales-engine, control-plane, agent-plane]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
      - name: Generate SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
      - name: Trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: Cosign sign
        uses: sigstore/cosign-installer@v3
      - run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  deploy-staging:
    name: Deploy staging (Coolify)
    runs-on: ubuntu-latest
    needs: build-images
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - name: Trigger Coolify deploy
        run: |
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_STAGING }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -d '{"sha":"${{ github.sha }}"}'
      - name: Wait for healthchecks
        run: |
          for i in {1..30}; do
            if curl -fs https://staging.vortex-ops.com/health; then exit 0; fi
            sleep 10
          done
          exit 1

  smoke-staging:
    name: Smoke tests on staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 9 }
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:smoke
        env:
          BASE_URL: https://staging.vortex-ops.com

  promote-canary:
    name: Promote 5% canary to production
    runs-on: ubuntu-latest
    needs: smoke-staging
    environment: production
    steps:
      - run: |
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_PROD }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -d '{"sha":"${{ github.sha }}","canary_pct":5}'

  monitor-canary:
    name: Monitor canary 10 min
    runs-on: ubuntu-latest
    needs: promote-canary
    steps:
      - name: Watch Sentry error rate
        run: |
          SHA="${{ github.sha }}"
          for i in {1..10}; do
            ERR=$(curl -s -H "Authorization: Bearer ${{ secrets.SENTRY_TOKEN }}" \
              "https://sentry.io/api/0/projects/vector-hr/vortex/events/?release=$SHA" \
              | jq '[.[] | select(.level == "error")] | length')
            if [ "$ERR" -gt 5 ]; then
              echo "❌ Canary error rate too high ($ERR errors). Aborting."
              exit 1
            fi
            sleep 60
          done

  promote-full:
    name: Promote 100% to production
    runs-on: ubuntu-latest
    needs: monitor-canary
    environment: production
    steps:
      - run: |
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_PROD }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -d '{"sha":"${{ github.sha }}","canary_pct":100}'
      - name: Notify Sentry of release
        uses: getsentry/action-release@v1
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
          SENTRY_ORG: vector-hr
          SENTRY_PROJECT: vortex
        with:
          version: ${{ github.sha }}
          environment: production
