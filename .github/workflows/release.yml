name: Release (staging → prod canary)

# DESACTIVADO en push automatico (2026-09-07).
#
# Este pipeline despliega vía webhooks de Coolify, plataforma que ADR-012
# descartó en favor de Fly.io sin que el workflow se actualizara. Hoy los
# secrets COOLIFY_* no existen, 3 de los 4 servicios de la matriz no tienen
# Dockerfile, y el job monitor-canary no revierte nada si detecta errores.
# Dispararlo en cada push a main significaba intentar un "deploy a produccion"
# roto en cada commit.
#
# Reactivar el trigger `push` cuando exista destino real de deploy (Fly.io,
# Cycle 2) y el canary tenga rollback de verdad.
on:
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/vortex

jobs:
  build-images:
    name: Build & push Docker images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    strategy:
      matrix:
        service: [hr-engine, sales-engine, control-plane, agent-plane]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: services/${{ matrix.service }}
          push: true
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:latest
      - name: Generate SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: spdx-json
      - name: Trivy scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
          format: sarif
          exit-code: "1"
          severity: CRITICAL,HIGH
      - name: Cosign sign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1
      - run: cosign sign --yes ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}:${{ github.sha }}
        env:
          COSIGN_EXPERIMENTAL: "1"

  deploy-staging:
    name: Deploy staging (Coolify)
    runs-on: ubuntu-latest
    needs: build-images
    environment: staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Trigger Coolify deploy
        run: |
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_STAGING }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -d '{"sha":"${{ github.sha }}"}'
      - name: Wait for healthchecks
        run: |
          for i in {1..30}; do
            if curl -fs https://staging.vortex-ops.com/health; then exit 0; fi
            sleep 10
          done
          exit 1

  smoke-staging:
    name: Smoke tests on staging
    runs-on: ubuntu-latest
    needs: deploy-staging
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm e2e:smoke
        env:
          BASE_URL: https://staging.vortex-ops.com

  promote-canary:
    name: Promote 5% canary to production
    runs-on: ubuntu-latest
    needs: smoke-staging
    environment: production
    steps:
      - run: |
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_PROD }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -d '{"sha":"${{ github.sha }}","canary_pct":5}'

  monitor-canary:
    name: Monitor canary 10 min
    runs-on: ubuntu-latest
    needs: promote-canary
    steps:
      - name: Watch Sentry error rate
        run: |
          SHA="${{ github.sha }}"
          for i in {1..10}; do
            ERR=$(curl -s -H "Authorization: Bearer ${{ secrets.SENTRY_TOKEN }}" \
              "https://sentry.io/api/0/projects/vector-hr/vortex/events/?release=$SHA" \
              | jq '[.[] | select(.level == "error")] | length')
            if [ "$ERR" -gt 5 ]; then
              echo "❌ Canary error rate too high ($ERR errors). Aborting."
              exit 1
            fi
            sleep 60
          done

  promote-full:
    name: Promote 100% to production
    runs-on: ubuntu-latest
    needs: monitor-canary
    environment: production
    steps:
      - run: |
          curl -X POST "${{ secrets.COOLIFY_WEBHOOK_PROD }}" \
            -H "Authorization: Bearer ${{ secrets.COOLIFY_TOKEN }}" \
            -d '{"sha":"${{ github.sha }}","canary_pct":100}'
      - name: Notify Sentry of release
        uses: getsentry/action-release@a74facf8a080ecbdf1cb355f16743530d712abb7 # v1.11.0
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_TOKEN }}
          SENTRY_ORG: vector-hr
          SENTRY_PROJECT: vortex
        with:
          version: ${{ github.sha }}
          environment: production
