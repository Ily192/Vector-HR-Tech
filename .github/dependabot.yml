version: 2
# cooldown: Dependabot espera 7 días antes de proponer una versión recién
# publicada, que es cuando suelen detectarse los paquetes comprometidos. Solo
# aplica a actualizaciones de versión: las de seguridad no esperan.
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Caracas"
    open-pull-requests-limit: 10
    groups:
      types:
        patterns: ["@types/*"]
      tooling:
        patterns: ["eslint*", "prettier*", "@biomejs/*", "vitest*", "playwright*"]
      next:
        patterns: ["next", "@vercel/*"]
      react:
        patterns: ["react", "react-dom", "@types/react*"]
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7

  - package-ecosystem: "pip"
    directory: "/services/hr-engine"
    schedule: { interval: "weekly", day: "monday" }
    commit-message: { prefix: "chore(hr-engine deps)" }
    cooldown: { default-days: 7 }

  # sales-engine se scaffoldea en Cycle 3. Mientras el directorio solo tenga
  # un README, apuntar dependabot ahi produce un error permanente.
  # - package-ecosystem: "pip"
  #   directory: "/services/sales-engine"
  #   schedule: { interval: "weekly", day: "monday" }
  #   commit-message: { prefix: "chore(sales-engine deps)" }

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule: { interval: "weekly", day: "monday" }
    commit-message: { prefix: "chore(actions)" }
    cooldown: { default-days: 7 }

  - package-ecosystem: "docker"
    directory: "/services/hr-engine"
    schedule: { interval: "weekly", day: "monday" }
    commit-message: { prefix: "chore(docker hr-engine)" }
    cooldown: { default-days: 7 }
