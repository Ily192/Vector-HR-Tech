      cédula profesional para turno nocturno (12x24). Sueldo de $16,800 MXN mensuales,
      prestaciones superiores a la ley, uniformes y comedor. Experiencia mínima de 1
      año en hospitalización.

  - id: leg-contador-junior
    pais: ve
    esperado: bajo
