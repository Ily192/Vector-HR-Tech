  - id: leg-encuestador-pago-por-pieza
    pais: mx
    esperado: bajo
    senal: pago por pieza legítimo de empresa de investigación
    titulo: Encuestador(a) de campo, temporal
    descripcion: |
      Empresa de investigación de mercados busca encuestadores(as) para un estudio de
      6 semanas en Toluca. Pago de $45 MXN por encuesta completa y validada (en
      promedio 15 a 20 al día), viáticos de transporte y capacitación de un día en
      nuestras oficinas. Te damos tableta y credencial.

  - id: leg-ayudante-construccion
    pais: mx
    esperado: bajo
    senal: pago semanal en obra, legítimo
    titulo: Ayudante general de construcción
    descripcion: |
      Constructora en Mérida, Yucatán, contrata ayudantes generales para obra de
      vivienda. Pago semanal de $2,600 MXN, alta en IMSS, equipo de protección
      personal y comida en obra. Presentarse con identificación en la oficina de obra
      de lunes a viernes de 8:00 a 10:00.

  # ─── Sospechosas (18) ────────────────────────────────────────────────────
  - id: sos-kit-de-inicio
    pais: mx
    esperado: alto
    senal: cobro por kit de inicio (multinivel)
    titulo: Asesor(a) de bienestar, ingresos ilimitados
