# Set sintético del verificador de vacantes (PR 3). Vacantes inventadas de México y
# Venezuela: ninguna empresa, persona, teléfono ni cuenta es real. Los números son de
# relleno (55 0000 0000) y los usuarios de mensajería, de ejemplo.
#
# esperado:
#   bajo  - oferta normal. Comisiones, trabajo remoto, pago por pieza o un WhatsApp
#           junto a datos de la empresa NO son fraude por sí solos.
#   medio - señales sin cobro: contacto solo por mensajería, enlace acortado, sueldo
#           irreal con "sin experiencia" y "desde casa", "sé tu propio jefe" sin empresa.
#   alto  - estafa o peligro: cobra al candidato, pide datos bancarios o documentos
#           antes de entrevistar, inversión o multinivel con pago, mula de dinero,
#           actividad ilegal, trata, suplantación de marca, tareas pagadas.
# senal: lo que debería ver el verificador (para leer los fallos, no se puntúa).

casos:
  # ─── Legítimas (22) ──────────────────────────────────────────────────────
  - id: leg-ventas-b2b-comision
    pais: mx
    esperado: bajo
    senal: comisiones con sueldo base y prestaciones
    titulo: Ejecutivo(a) de ventas B2B
    descripcion: |
      Distribuidora Industrial Norteña busca ejecutivo(a) de ventas para atender cuentas
      de clientes industriales en Monterrey y su área metropolitana.
      Ofrecemos: sueldo base de $12,000 MXN mensuales más comisiones de hasta 8% sobre
      venta cobrada, prestaciones de ley, seguro de gastos médicos menores y auto
      utilitario para visitas. Requisitos: 2 años de experiencia en venta consultiva,
      licencia de manejo vigente y manejo de CRM. Envía tu CV por este medio; las
      entrevistas son presenciales en nuestras oficinas de Apodaca.

  - id: leg-call-center-bilingue
    pais: mx
    esperado: bajo
    senal: call center con sueldo y capacitación pagada
    titulo: Agente de atención telefónica bilingüe
    descripcion: |
      Centro de contacto en Zapopan contrata agentes con inglés conversacional (B2) para
      soporte a clientes de una aerolínea. Sueldo de $14,500 MXN mensuales más bono de
      productividad de hasta $2,000. Capacitación de 3 semanas pagada desde el primer
      día. Turnos de 9 horas con dos días de descanso. Contratación directa, IMSS e
      Infonavit. Aplica por esta plataforma y agenda tu evaluación de inglés en nuestro
      edificio de Av. Vallarta.

  - id: leg-repartidor-moto-propia
    pais: ve
    esperado: bajo
    senal: pide moto propia pero paga por entrega y reconoce gasolina
    titulo: Repartidor motorizado con moto propia
    descripcion: |
      Farmacias Del Ávila busca repartidores motorizados para la zona este de Caracas.
      Debes tener moto propia en buen estado, licencia de quinto grado y certificado
      médico vigente. Pagamos 3 USD por entrega dentro de la zona más bono semanal por
      puntualidad, y reconocemos 10 USD semanales de gasolina. Horario de 8:00 a 17:00
      de lunes a sábado. Las entrevistas son en nuestra sede de Los Ruices.

  - id: leg-pasantia-academica
    pais: ve
    esperado: bajo
    senal: pasantía curricular sin pago, con convenio universitario
    titulo: Pasantía académica en contabilidad (requisito de grado)
    descripcion: |
      Firma de auditoría en Mérida recibe estudiantes de último año de Contaduría
      Pública para pasantías curriculares de 12 semanas, dentro del convenio con la
      universidad. La pasantía no es remunerada, como establece el reglamento
      académico, e incluye tutor empresarial, constancia y evaluación para la
      universidad. Se requiere carta de postulación de la escuela.

  - id: leg-backend-remoto
    pais: mx
    esperado: bajo
    senal: trabajo remoto real con proceso técnico
    titulo: Desarrollador(a) backend Python, remoto
    descripcion: |
      Startup de logística con oficinas en CDMX busca desarrollador(a) backend con 3+
      años en Python y FastAPI. Trabajo 100% remoto dentro de México, contrato por
      tiempo indeterminado, sueldo de $55,000 a $70,000 MXN brutos según experiencia.
      Proceso: entrevista con RH, prueba técnica pagada de 4 horas y entrevista con el
      equipo por videollamada. Te damos laptop y apoyo de internet.

  - id: leg-asistente-administrativa
    pais: ve
    esperado: bajo
    senal: oferta administrativa estándar
    titulo: Asistente administrativa
    descripcion: |
      Distribuidora de alimentos en Valencia (zona industrial Castillito) solicita
      asistente administrativa para facturación y archivo. Experiencia mínima de 1
      año, manejo de Excel y del sistema Profit. Sueldo de 280 USD mensuales más bono
      de alimentación, horario de lunes a viernes de 8:00 a 17:00.

  - id: leg-almacen-turno-rotativo
    pais: mx
    esperado: bajo
    senal: puesto operativo con prestaciones
    titulo: Auxiliar de almacén, turno rotativo
    descripcion: |
      Centro de distribución en Santa Catarina, N.L., contrata auxiliares de almacén
      para surtido y carga. Turnos rotativos semanales, sueldo semanal de $2,900 MXN,
      vales de despensa, comedor subsidiado y transporte de personal. Secundaria
      terminada. Contratación directa con IMSS desde el primer día.

  - id: leg-vendedor-piso-comision
    pais: mx
    esperado: bajo
    senal: comisión por ventas en tienda física
    titulo: Vendedor(a) de piso, línea blanca
    descripcion: |
      Tienda departamental en Puebla busca vendedores de piso para el departamento de
      línea blanca. Sueldo base de $8,500 MXN más comisiones por venta (en promedio
      $4,000 adicionales al mes), descuento de empleado y prestaciones superiores a la
      ley. Horario mixto con un día de descanso entre semana.

  - id: leg-cajero-farmacia
    pais: ve
    esperado: bajo
    senal: puesto de tienda estándar
    titulo: Cajero(a) de farmacia
    descripcion: |
      Cadena de farmacias en Maracaibo solicita cajeros(as) para sus sucursales de
      Av. 5 de Julio y Bella Vista. Bachiller, experiencia en caja, buen trato con el
      público. Pago de 220 USD mensuales más bonos de productividad. Horario por
      turnos. Postúlate por esta vía o entrega tu CV en recursos humanos de la sede
      principal.

  - id: leg-atencion-home-office
    pais: mx
    esperado: bajo
    senal: home office legítimo con equipo propio y sueldo realista
    titulo: Representante de atención a clientes, home office
    descripcion: |
      Empresa de telecomunicaciones contrata representantes de atención por chat para
      trabajar desde casa. Necesitas computadora propia, internet de al menos 20 Mbps y
      un espacio silencioso. Sueldo de $11,000 MXN mensuales, prestaciones de ley y
      capacitación remota pagada de dos semanas. Horario de 8 horas en turno matutino
      o vespertino. Proceso: entrevista por videollamada con RH y prueba de redacción.

  - id: leg-asesor-seguros
    pais: mx
    esperado: bajo
    senal: venta de seguros con base, capacitación y cédula, sin cobro
    titulo: Asesor(a) de seguros de vida
    descripcion: |
