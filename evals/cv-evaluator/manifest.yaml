skill: cv-evaluator
suite_files:
  golden: golden.jsonl
  regression: regression.jsonl
thresholds:
  pearson_r: 0.75   # Cycle 1 DoD
  pass_rate: 0.7    # ≥70% de las predicciones dentro de ±1.5 puntos del expected
  min_cases: 10     # Cycle 1 DoD: con menos casos Pearson r no es estable
notes: |
  Ground truth aún por poblar (Cycle 1 wk2 entregable 2.5): golden.jsonl y
  regression.jsonl tienen 0 casos reales, solo comentarios.

  Hasta que se pueble y `_run_cv_evaluator()` se conecte al modelo, correr
  `runner.py --fail-below-threshold` FALLA a propósito. Antes pasaba en verde
  con 0 casos y con una predicción que era el propio ground truth: un gate que
  no podía fallar.
