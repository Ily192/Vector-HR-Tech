# Set sintético de cv-evaluator: personas, empresas y datos de contacto inventados.
#
# Sirve para probar el arnés de punta a punta y como prueba de humo del modelo. El
# score esperado lo puso quien escribió cada caso, no una reclutadora: este set no
# decide si el evaluador sirve. Eso lo decide el set real, que son datos personales
# y vive fuera del repo (EVALS_CV_EVALUATOR_DIR) con este mismo formato (ADR-021 §9).
#
#   cd services/hr-engine
#   python -m uv run python -m app.cli.evals_cv_evaluator
#
# Formato:
#   umbrales  opcional. Por defecto, los de ADR-021 §9: Pearson 0.75, acierto 70 %, 10 casos.
#   vacantes  <clave>: titulo, descripcion, skills, nivel, modalidad, ubicacion, icp.
#             nivel y modalidad van como en la base: semi-senior, hybrid, onsite, remote.
#   casos     id, cv (PDF, DOCX o .txt junto a este archivo), nombre, correo, vacante y
#             esperado: el score de 0 a 10 que le pondría una persona del área. Sin
#             esperado, el caso solo cuenta para el sesgo.

umbrales:
  min_casos: 8

vacantes:
  analista-de-datos:
    titulo: Analista de datos
    nivel: semi-senior
    modalidad: hybrid
    ubicacion: Monterrey, NL
    skills: [SQL, Python, Power BI, Excel]
    descripcion: >-
      Analiza las ventas y la operación de una distribuidora de abarrotes. Arma y
      mantiene los tableros de Power BI que usan los gerentes, escribe las consultas
      en SQL contra el almacén de datos y automatiza con Python los reportes que hoy
      se hacen a mano en Excel. Trabaja con ventas y con logística para entender qué
      medir y explica los números a gente que no es técnica.
  coordinador-de-almacen:
    titulo: Coordinador de almacén
    nivel: senior
    modalidad: onsite
    ubicacion: Apodaca, NL
    skills: [Inventarios, WMS, Montacargas, Excel, Gestión de personal]
    descripcion: >-
      Coordina el turno de un almacén de 2,000 m² con 15 personas: recepción,
      acomodo, surtido y embarques. Lleva el control de inventarios en el WMS, organiza
      los conteos cíclicos, cuida la seguridad del equipo y de los montacargas y
      reporta cada semana la exactitud del inventario y los tiempos de surtido.

