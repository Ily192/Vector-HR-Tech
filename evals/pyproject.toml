[project]
name = "vortex-evals"
version = "0.1.0"
description = "Vortex Ops · evals harness para skills"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "scipy>=1.14.0",
    "google-generativeai>=0.8.0",
    "openai>=1.54.0",
    "pyyaml>=6.0.2",
    "typer>=0.12.0",
    "rich>=13.9.0",
]

# Este proyecto no se empaqueta: es un script (`runner.py`) que se corre con
# `uv run`. Declarar un build-system con `packages = ["vortex_evals"]` apuntaba
# a un directorio inexistente y producia una wheel vacia, sin runner.py dentro.

