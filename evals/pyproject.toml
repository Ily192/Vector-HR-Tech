[project]
name = "vortex-evals"
version = "0.1.0"
description = "Vortex Ops · evals harness para skills"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9.0",
    "scipy>=1.14.0",
    "google-generativeai>=0.8.0",
    "openai>=1.54.0",
    "pyyaml>=6.0.2",
    "typer>=0.12.0",
    "rich>=13.9.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vortex_evals"]
